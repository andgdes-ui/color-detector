<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колеровка по фото</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            background: #000;
            margin-bottom: 15px;
            display: none;
            transform: scaleX(-1); /* зеркалим для удобства */
        }
        canvas { display: none; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 14px 24px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            background: #2a9d8f;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            flex: 1 0 auto;
            max-width: 200px;
        }
        button:active { transform: scale(0.95); }
        button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .btn-secondary { background: #264653; }
        .btn-danger { background: #e76f51; }
        #status {
            margin: 10px 0;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            min-height: 1.5em;
        }
        #error-msg {
            background: #442222;
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            max-width: 400px;
            text-align: center;
            font-size: 14px;
        }
        #result {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }
        .palette-block {
            background: #1e1e1e;
            border-radius: 14px;
            padding: 14px 18px;
            border-left: 5px solid #2a9d8f;
        }
        .palette-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .color-match {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .color-match:last-child { border-bottom: none; }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid #555;
            flex-shrink: 0;
        }
        .color-name { flex: 1; font-size: 15px; }
        .color-percent { font-size: 16px; font-weight: 700; color: #2a9d8f; }
        .hex-code { font-size: 12px; color: #aaa; margin-left: 6px; }
        .no-result { color: #888; font-style: italic; }
        #loading {
            display: none;
            color: #aaa;
            margin: 15px 0;
        }
        #send {
            display: none;
            margin-top: 15px;
            background: #e76f51;
        }
        .hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>

<!-- Скрытый input для выбора из галереи (fallback) -->
<input type="file" accept="image/*" id="fileInput" class="hidden-input">

<div id="error-msg"></div>
<div id="status">📷 Нажмите «Включить камеру»</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="controls">
    <button id="btnCamera">📷 Включить камеру</button>
    <button id="btnSnap" disabled>📸 Сделать снимок</button>
    <button id="btnGallery" class="btn-secondary">🖼 Выбрать фото</button>
</div>

<div id="loading">⏳ Определяем цвета...</div>
<div id="result"></div>
<button id="send">✅ Отправить боту</button>

<script type="importmap">
{
    "imports": {
        "chromonym": "https://cdn.jsdelivr.net/npm/chromonym@3.5.0/dist/index.mjs"
    }
}
</script>

<script type="module">
    import { identify, ral, ncs, pantone } from 'chromonym';

    // ----- ПАЛИТРЫ (можно расширять) -----
    const tikkurilaData = {
        name: 'Tikkurila Symphony',
        colors: {
            'Y404 - Peltola': '#E8D3B9',
            'X503 - Kauppa': '#C5A48A',
            'V499 - Lato': '#A8826A',
        }
    };
    const duluxData = {
        name: 'Dulux',
        colors: {
            'Pure White': '#FFFFFF',
            'Natural Slate': '#A5A5A5',
            'Soft Beige': '#D8C8B0',
        }
    };
    const bsData = {
        name: 'BS 4800',
        colors: {
            '04-B-21': '#B8A08E',
            '10-B-15': '#8E9A9A',
        }
    };
    const palettes = [
        { id: 'ral', label: 'RAL Classic', palette: ral },
        { id: 'ncs', label: 'NCS', palette: ncs },
        { id: 'pantone', label: 'Pantone', palette: pantone },
        { id: 'tikkurila', label: 'Tikkurila Symphony', palette: tikkurilaData },
        { id: 'dulux', label: 'Dulux', palette: duluxData },
        { id: 'bs', label: 'BS 4800', palette: bsData },
    ];

    // ----- DOM -----
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const errorDiv = document.getElementById('error-msg');
    const btnCamera = document.getElementById('btnCamera');
    const btnSnap = document.getElementById('btnSnap');
    const btnGallery = document.getElementById('btnGallery');
    const fileInput = document.getElementById('fileInput');
    const loadingDiv = document.getElementById('loading');
    const resultDiv = document.getElementById('result');
    const sendBtn = document.getElementById('send');

    let stream = null;
    let cameraActive = false;
    let lastColorData = null;

    // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
    function setStatus(msg) {
        statusDiv.textContent = msg;
    }
    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
    }
    function hideError() {
        errorDiv.style.display = 'none';
    }
    function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(c => Math.round(c).toString(16).padStart(2, '0')).join('');
    }
    function hexToRgb(hex) {
        const res = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return res ? { r: parseInt(res[1],16), g: parseInt(res[2],16), b: parseInt(res[3],16) } : null;
    }
    function colorDistance(r1,g1,b1, r2,g2,b2) {
        const dr = r1-r2, dg = g1-g2, db = b1-b2;
        return Math.sqrt(dr*dr + dg*dg + db*db);
    }
    function findClosestColors(r, g, b, paletteObj, count=2) {
        const colors = paletteObj.colors;
        if (!colors || Object.keys(colors).length===0) return [];
        return Object.entries(colors)
            .map(([name, hex]) => {
                const c = hexToRgb(hex);
                if (!c) return null;
                return { name, hex, dist: colorDistance(r,g,b, c.r,c.g,c.b) };
            })
            .filter(Boolean)
            .sort((a,b) => a.dist - b.dist)
            .slice(0, count);
    }
    function getPercentage(dist) {
        const maxDist = Math.sqrt(3) * 255;
        return Math.round((1 - Math.min(dist/maxDist, 1)) * 100);
    }

    // ----- АНАЛИЗ ИЗОБРАЖЕНИЯ (canvas) -----
    function analyzeImage(imageSource) {
        // imageSource может быть video или img
        const width = imageSource.videoWidth || imageSource.width;
        const height = imageSource.videoHeight || imageSource.height;
        if (!width || !height) {
            showError('Не удалось получить размеры изображения');
            return;
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(imageSource, 0, 0, width, height);
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        let r=0,g=0,b=0,count=0;
        for (let i=0; i<data.length; i+=4) {
            r += data[i];
            g += data[i+1];
            b += data[i+2];
            count++;
        }
        r /= count; g /= count; b /= count;
        const hex = rgbToHex(r, g, b);
        lastColorData = { hex };

        loadingDiv.style.display = 'block';
        resultDiv.innerHTML = '';
        setTimeout(() => {
            let html = '';
            for (const p of palettes) {
                const matches = findClosestColors(r, g, b, p.palette, 2);
                if (matches.length===0) {
                    html += `<div class="palette-block"><div class="palette-title">${p.label}</div><div class="no-result">Нет данных</div></div>`;
                    continue;
                }
                let matchHtml = '';
                for (const m of matches) {
                    const percent = getPercentage(m.dist);
                    matchHtml += `
                        <div class="color-match">
                            <div class="color-swatch" style="background:${m.hex}"></div>
                            <span class="color-name">${m.name} <span class="hex-code">${m.hex}</span></span>
                            <span class="color-percent">${percent}%</span>
                        </div>
                    `;
                }
                html += `<div class="palette-block"><div class="palette-title">${p.label}</div>${matchHtml}</div>`;
            }
            resultDiv.innerHTML = html;
            loadingDiv.style.display = 'none';
            sendBtn.style.display = 'inline-block';
            // Сохраняем первое название для отправки
            const firstName = document.querySelector('.color-name')?.textContent?.trim() || 'неизвестно';
            lastColorData.color_name = firstName;
        }, 100);
    }

    // ----- ЗАПУСК КАМЕРЫ -----
    async function startCamera() {
        hideError();
        setStatus('⏳ Запрос доступа...');
        btnCamera.disabled = true;

        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('getUserMedia не поддерживается этим браузером');
            }

            // Важно: явно указываем параметры
            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.style.display = 'block';
            // Ждём загрузки
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });

            cameraActive = true;
            btnSnap.disabled = false;
            btnCamera.style.display = 'none';
            setStatus('📸 Камера работает, нажмите «Сделать снимок»');
        } catch (err) {
            console.error('Camera error:', err);
            let msg = '⚠️ Ошибка доступа к камере.\n\n';
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                msg += 'Вы запретили доступ. Разрешите в настройках браузера и обновите страницу.';
            } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                msg += 'Камера не найдена. Проверьте подключение.';
            } else if (err.name === 'NotReadableError') {
                msg += 'Камера занята другим приложением.';
            } else {
                msg += `Ошибка: ${err.message}`;
            }
            showError(msg);
            setStatus('❌ Не удалось запустить камеру');
            btnCamera.disabled = false;
            // Предлагаем использовать галерею
            btnGallery.style.display = 'inline-block';
        }
    }

    // ----- ОСТАНОВКА КАМЕРЫ (освобождение ресурсов) -----
    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        video.style.display = 'none';
        cameraActive = false;
        btnSnap.disabled = true;
        btnCamera.style.display = 'inline-block';
        btnCamera.disabled = false;
        setStatus('📷 Камера отключена');
    }

    // ----- ОБРАБОТЧИКИ -----
    btnCamera.addEventListener('click', startCamera);

    btnSnap.addEventListener('click', () => {
        if (!cameraActive) return;
        analyzeImage(video);
        // После снимка можно оставить камеру включенной для повторных снимков
    });

    // Выбор фото из галереи (fallback)
    btnGallery.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                analyzeImage(img);
                // Освобождаем память
                URL.revokeObjectURL(img.src);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        fileInput.value = ''; // сброс
    });

    // Отправка боту
    sendBtn.addEventListener('click', () => {
        if (lastColorData) {
            Telegram.WebApp.sendData(JSON.stringify(lastColorData));
            Telegram.WebApp.close();
        }
    });

    // Инициализация
    setStatus('📷 Нажмите «Включить камеру» или выберите фото');
    // Если камера не запущена, показываем кнопку галереи
    btnGallery.style.display = 'inline-block';
</script>
</body>
</html>
