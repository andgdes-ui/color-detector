<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест камеры</title>
    <style>
        video { width: 100%; max-width: 400px; background: #000; }
        button { padding: 16px; font-size: 18px; margin: 10px; }
        #result { margin-top: 20px; font-size: 20px; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <button id="btnStart">▶️ Включить камеру</button>
    <button id="btnSnap" disabled>📸 Снимок</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="result"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnStart = document.getElementById('btnStart');
        const btnSnap = document.getElementById('btnSnap');
        const resultDiv = document.getElementById('result');

        let stream = null;

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                btnSnap.disabled = false;
                btnStart.disabled = true;
                resultDiv.textContent = '✅ Камера работает';
            } catch (err) {
                resultDiv.textContent = '❌ Ошибка: ' + err.message;
                console.error(err);
            }
        });

        btnSnap.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let r=0,g=0,b=0,count=0;
            for (let i=0; i<data.length; i+=4) {
                r += data[i]; g += data[i+1]; b += data[i+2]; count++;
            }
            r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
            const hex = '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
            resultDiv.innerHTML = `🎨 Цвет: <span style="background:${hex};padding:10px;border-radius:8px;color:#fff">${hex}</span>`;
        });
    </script>
</body>
</html>
