<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цвет по фото</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none;">
<button onclick="document.getElementById('cameraInput').click()">📸 Сделать фото</button>

<div id="result"></div>

<script>
  document.getElementById('cameraInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = function() {
      // Берём средний цвет из фото
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let r=0,g=0,b=0,count=0;
      for (let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; }
      const hex = '#' + [r/g, g/count, b/count].map(c => Math.round(c).toString(16).padStart(2,'0')).join('');
      document.getElementById('result').innerHTML = `🎨 Цвет: <span style="background:${hex};padding:10px;border-radius:8px">${hex}</span>`;
      
      // Отправка боту (если нужно)
      Telegram.WebApp.sendData(JSON.stringify({ hex }));
      Telegram.WebApp.close();
    };
    img.src = URL.createObjectURL(file);
  });
</script>
</body>
</html>
