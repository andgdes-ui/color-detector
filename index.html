<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Определитель цвета</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        video, canvas { display: none; }
        #camera {
            display: block;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            background: #000;
            margin-bottom: 20px;
            min-height: 300px;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            background: #2a9d8f;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        #result {
            width: 100%;
            max-width: 500px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .palette-block {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 5px solid #2a9d8f;
        }
        .palette-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .color-match {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #333;
        }
        .color-match:last-child { border-bottom: none; }
        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #555;
            flex-shrink: 0;
        }
        .color-name { flex: 1; font-size: 16px; }
        .color-percent { font-size: 18px; font-weight: 700; color: #2a9d8f; }
        .no-result { color: #888; font-style: italic; }
        .hex-code { font-size: 13px; color: #aaa; margin-left: 8px; }
        #loading { display: none; color: #aaa; margin-top: 20px; }
        #error-msg {
            background: #442222;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            max-width: 400px;
            text-align: center;
        }
        #send { margin-top: 20px; background: #e76f51; }
        #debug {
            background: #222;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<canvas id="canvas" width="200" height="200"></canvas>

<div id="error-msg"></div>
<div id="debug"></div>

<div class="controls">
    <button id="snap">📸 Сделать снимок</button>
    <button id="retry" style="display:none;">🔄 Попробовать снова</button>
    <button id="send" style="display:none;">✅ Отправить боту</button>
</div>
<div id="loading">⏳ Определяем цвета...</div>
<div id="result"></div>

<script type="importmap">
{
    "imports": {
        "chromonym": "https://cdn.jsdelivr.net/npm/chromonym@3.5.0/dist/index.mjs"
    }
}
</script>

<script type="module">
    import { identify, ral, ncs, pantone } from 'chromonym';

    // --- ПАЛИТРЫ (примеры) ---
    const tikkurilaData = {
        name: 'Tikkurila Symphony',
        colors: {
            'Y404 - Peltola': '#E8D3B9',
            'X503 - Kauppa': '#C5A48A',
            'V499 - Lato': '#A8826A',
        }
    };
    const duluxData = {
        name: 'Dulux',
        colors: {
            'Pure White': '#FFFFFF',
            'Natural Slate': '#A5A5A5',
            'Soft Beige': '#D8C8B0',
        }
    };
    const bsData = {
        name: 'BS 4800',
        colors: {
            '04-B-21': '#B8A08E',
            '10-B-15': '#8E9A9A',
        }
    };
    const palettes = [
        { id: 'ral', label: 'RAL Classic', palette: ral },
        { id: 'ncs', label: 'NCS', palette: ncs },
        { id: 'pantone', label: 'Pantone', palette: pantone },
        { id: 'tikkurila', label: 'Tikkurila Symphony', palette: tikkurilaData },
        { id: 'dulux', label: 'Dulux', palette: duluxData },
        { id: 'bs', label: 'BS 4800', palette: bsData },
    ];

    // --- ОБЪЯВЛЕНИЕ ЭЛЕМЕНТОВ ---
    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const snapBtn = document.getElementById('snap');
    const sendBtn = document.getElementById('send');
    const retryBtn = document.getElementById('retry');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const errorDiv = document.getElementById('error-msg');
    const debugDiv = document.getElementById('debug');

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    function logDebug(msg) {
        debugDiv.style.display = 'block';
        debugDiv.textContent += msg + '\n';
        console.log(msg);
    }

    function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    }

    function colorDistance(r1, g1, b1, r2, g2, b2) {
        const dr = r1 - r2;
        const dg = g1 - g2;
        const db = b1 - b2;
        return Math.sqrt(dr*dr + dg*dg + db*db);
    }

    function findClosestColors(r, g, b, paletteObj, count = 2) {
        const colors = paletteObj.colors;
        if (!colors || Object.keys(colors).length === 0) return [];
        const entries = Object.entries(colors);
        const withDist = entries.map(([name, hex]) => {
            const c = hexToRgb(hex);
            if (!c) return null;
            const dist = colorDistance(r, g, b, c.r, c.g, c.b);
            return { name, hex, dist };
        }).filter(Boolean);
        withDist.sort((a, b) => a.dist - b.dist);
        return withDist.slice(0, count);
    }

    function getPercentage(dist) {
        const maxDist = Math.sqrt(3) * 255;
        const normalized = Math.min(dist / maxDist, 1);
        return Math.round((1 - normalized) * 100);
    }

    // --- ОСНОВНАЯ ЛОГИКА КАМЕРЫ ---
    async function startCamera() {
        logDebug('▶️ startCamera() вызвана');
        try {
            // Проверка поддержки
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('getUserMedia не поддерживается браузером');
            }
            logDebug('✅ getUserMedia доступен');

            // Запрос камеры с явными параметрами
            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };
            logDebug(`📷 Запрашиваем камеру с constraints: ${JSON.stringify(constraints)}`);

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            logDebug('✅ Поток получен');

            video.srcObject = stream;
            video.style.display = 'block';
            errorDiv.style.display = 'none';
            retryBtn.style.display = 'none';

            // Ждём, когда видео загрузится
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    logDebug(`✅ Видео загружено, размер: ${video.videoWidth}x${video.videoHeight}`);
                    resolve();
                };
            });

            logDebug('✅ Камера успешно запущена');
        } catch (err) {
            logDebug(`❌ Ошибка при запуске камеры: ${err.name} - ${err.message}`);
            let errorMessage = '⚠️ Не удалось получить доступ к камере.\n\n';
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                errorMessage += 'Вы запретили доступ к камере. Разрешите в настройках браузера и обновите страницу.';
            } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                errorMessage += 'Камера не найдена. Убедитесь, что она подключена.';
            } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                errorMessage += 'Камера занята другим приложением. Закройте другие программы.';
            } else {
                errorMessage += `Ошибка: ${err.message}`;
            }
            errorDiv.textContent = errorMessage;
            errorDiv.style.display = 'block';
            retryBtn.style.display = 'inline-block';
        }
    }

    // --- ОБРАБОТЧИК СНИМКА ---
    snapBtn.addEventListener('click', () => {
        if (!video.srcObject) {
            alert('Камера не запущена. Нажмите "Попробовать снова".');
            return;
        }

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
            r += data[i];
            g += data[i+1];
            b += data[i+2];
            count++;
        }
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);
        const hex = rgbToHex(r, g, b);
        logDebug(`🎨 Средний цвет: ${hex} (${r},${g},${b})`);

        loadingDiv.style.display = 'block';
        resultDiv.innerHTML = '';

        setTimeout(() => {
            let html = '';
            for (const p of palettes) {
                const matches = findClosestColors(r, g, b, p.palette, 2);
                if (matches.length === 0) {
                    html += `<div class="palette-block"><div class="palette-title">${p.label}</div><div class="no-result">Нет данных</div></div>`;
                    continue;
                }
                let matchesHtml = '';
                for (const m of matches) {
                    const percent = getPercentage(m.dist);
                    matchesHtml += `
                        <div class="color-match">
                            <div class="color-swatch" style="background:${m.hex}"></div>
                            <span class="color-name">${m.name} <span class="hex-code">${m.hex}</span></span>
                            <span class="color-percent">${percent}%</span>
                        </div>
                    `;
                }
                html += `<div class="palette-block"><div class="palette-title">${p.label}</div>${matchesHtml}</div>`;
            }
            resultDiv.innerHTML = html;
            loadingDiv.style.display = 'none';
            sendBtn.style.display = 'inline-block';
            logDebug('✅ Результаты отображены');
        }, 100);
    });

    // --- ПОВТОРНАЯ ПОПЫТКА ---
    retryBtn.addEventListener('click', () => {
        errorDiv.style.display = 'none';
        retryBtn.style.display = 'none';
        startCamera();
    });

    // --- ОТПРАВКА БОТУ ---
    sendBtn.addEventListener('click', () => {
        const data = {
            color_name: document.querySelector('.color-name')?.textContent?.trim() || 'неизвестно',
            hex: document.querySelector('.hex-code')?.textContent?.trim() || '',
        };
        Telegram.WebApp.sendData(JSON.stringify(data));
        Telegram.WebApp.close();
    });

    // --- СТАРТ ---
    logDebug('🚀 Приложение загружено');
    startCamera();
</script>
</body>
</html>
